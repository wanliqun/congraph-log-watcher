name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -tags=integration ./internal/integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t graph-log-watcher:test .
      - run: docker compose -f deploy/docker-compose.yaml config
        env:
          DINGTALK_WEBHOOK: https://example.test/webhook
          DINGTALK_SECRET: test-secret
      - run: >-
          docker run --rm
          -e DINGTALK_WEBHOOK=https://example.test/webhook
          -e DINGTALK_SECRET=test-secret
          -v "$PWD/config/example.yaml:/config.yaml:ro"
          graph-log-watcher:test check-config --config /config.yaml
