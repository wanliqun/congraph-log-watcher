services:
  graph-log-watcher:
    build: ..
    command: ["run", "--config", "/etc/graph-log-watcher/config.yaml", "--dry-run"]
    environment:
      DINGTALK_WEBHOOK: ${DINGTALK_WEBHOOK}
      DINGTALK_SECRET: ${DINGTALK_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../config/example.yaml:/etc/graph-log-watcher/config.yaml:ro
      - watcher-state:/var/lib/graph-log-watcher
    ports:
      - "9108:9108"
    healthcheck:
      test: ["CMD", "/graph-log-watcher", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  watcher-state:
